# Pings the Supabase database every 3 days so the free project never pauses
# for inactivity. Needs two repository secrets: SUPABASE_URL and SUPABASE_KEY.
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 9 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          # tidy up common copy-paste slips: spaces, quotes, trailing slash
          URL=$(printf '%s' "$SUPABASE_URL" | tr -d " \"'\r\n")
          URL=${URL%/}
          KEY=$(printf '%s' "$SUPABASE_KEY" | tr -d " \"'\r\n")
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "SUPABASE_URL or SUPABASE_KEY secret is missing or empty."; exit 1
          fi
          case "$URL" in https://*.supabase.co) ;; *)
            echo "SUPABASE_URL should look like https://YOUR-PROJECT-ID.supabase.co"; exit 1;; esac

          CODE=$(curl -sS -o body.txt -w '%{http_code}' -X POST "$URL/rest/v1/rpc/ping" \
            -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}')
          echo "Supabase answered HTTP $CODE: $(cat body.txt)"
          [ "$CODE" -lt 400 ] || exit 1