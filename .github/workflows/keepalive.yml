# Pings the Supabase database every 3 days so the free project never pauses
# for inactivity. Needs two repository secrets: SUPABASE_URL and SUPABASE_KEY.
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 9 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          curl -fsS "$SUPABASE_URL/rest/v1/items?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY" -o /dev/null
          echo "Supabase pinged"
